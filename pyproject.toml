[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "efgpp2"
version = "0.1.0"
description = "Modular genotype-phenotype and multi-omics prediction framework"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "pyarrow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ml = ["scikit-learn>=1.3"]
omics = ["zarr>=2.16", "xarray>=2024.1"]
duckdb = ["duckdb>=1.0"]

[project.scripts]
efgpp2 = "efgpp2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

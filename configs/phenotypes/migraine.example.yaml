name: migraine
task: binary
target_column: Phenotype
sample_id_column: IID
family_id_column: FID
positive_label: 1
genome_build: GRCh37
ancestry: European
description: Example migration of the original EFGPP migraine analysis.

covariates:
  - age
  - sex

inputs:
  genotype:
    format: plink1
    path: /data/project/migraine/genotype/migraine
  phenotype:
    path: /data/project/migraine/phenotype.tsv
  covariates:
    path: /data/project/migraine/covariates.tsv
  gwas:
    - name: migraine_gwas_1
      path: /data/project/migraine/gwas/migraine.gz
      genome_build: GRCh37
    - name: migraine_gwas_2
      path: /data/project/migraine/gwas/migraine_5.gz
      genome_build: GRCh37

feature_sets:
  genotype:
    top_n: [50, 200, 500, 1000, 5000, 10000]
    pvalue_thresholds: [5e-8, 1e-6, 1e-4, 0.01, 0.05, 0.1, 1.0]
  annotations:
    enabled: true
  prs:
    tools: [plink_ct, prsice2, annopred, ldak]
  pca:
    components: 10
  omics: []

splitting:
  strategy: stratified_kfold
  folds: 5
  seed: 42
